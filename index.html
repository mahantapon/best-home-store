<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="คลังสินค้า">
  <title>คลังสินค้า best home</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/LINESeedSansTH_W_Rg.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/LINESeedSansTH_W_Bd.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-route="home">
  <div class="shell">
    <aside class="side" id="side" aria-label="เมนูหลัก"></aside>

    <div class="main">
      <header class="topbar">
        <a class="m-brand" href="#/" aria-label="หน้าแรก"><img src="icon.svg" alt=""></a>
        <div class="ttl" id="ttl"></div>
        <label class="search" id="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" inputmode="search" placeholder="ค้นหาสินค้า เช่น ข้องอ 1/2, สามทาง" autocomplete="off">
        </label>
        <a class="cart-btn" href="#/cart" id="topcart" aria-label="ตะกร้า"></a>
      </header>
      <div id="banner"></div>
      <main class="page" id="page"></main>
    </div>
  </div>

  <nav class="tabs" id="tabs" aria-label="เมนู"></nav>
  <a class="cartbar" id="cartbar" href="#/cart" hidden></a>

  <div class="sheet-wrap" id="sheet-wrap" hidden>
    <div class="backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="data/seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
